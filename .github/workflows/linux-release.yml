name: Release (Linux)

on:
  workflow_dispatch:

env:
  CONTAINER: andrewdavidsmith/transferase-build

jobs:
  linux-releases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Start docker container
        # Pull the container, run it in detached mode, mount the workspace
        run: |
          docker pull $CONTAINER
          docker run --name build-container \
          -d -v ${{ github.workspace }}:/workspace $CONTAINER tail -f /dev/null
      - name: Configure, build and package
        env:
          SCRIPT: |
            cd /workspace
            git clone --recursive https://github.com/Mbed-TLS/mbedtls.git &&
            cd mbedtls &&
            python3.13 -m pip install -r scripts/basic.requirements.txt &&
            export CC=gcc &&
            cmake -B build \
            -DUSE_STATIC_MBEDTLS_LIBRARY=on \
            -DENABLE_TESTING=off \
            -DENABLE_PROGRAMS=off \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_POSITION_INDEPENDENT_CODE=on \
            -DCMAKE_BUILD_TYPE=Release &&
            cmake --build build -j4 &&
            cmake --install build &&
            cd /workspace &&
            git clone https://github.com/curl/curl.git &&
            cd curl &&
            cmake -B build \
            -DBUILD_CURL_EXE=off \
            -DBUILD_LIBCURL_DOCS=off \
            -DBUILD_MISC_DOCS=off \
            -DENABLE_CURL_MANUAL=off \
            -DBUILD_EXAMPLES=off \
            -DBUILD_TESTING=off \
            -DCURL_USE_LIBSSH2=off \
            -DCURL_USE_PKGCONFIG=off \
            -DCURL_ZLIB=off \
            -DCURL_ZSTD=off \
            -DCURL_BROTLI=off \
            -DCURL_USE_LIBPSL=off \
            -DCURL_DISABLE_FTP=on \
            -DCURL_DISABLE_IMAP=on \
            -DCURL_DISABLE_POP3=on \
            -DCURL_DISABLE_PROGRESS_METER=on \
            -DCURL_DISABLE_RTSP=on \
            -DCURL_DISABLE_SMTP=on \
            -DCURL_DISABLE_TELNET=on \
            -DCURL_DISABLE_TFTP=on \
            -DCURL_DISABLE_WEBSOCKETS=on \
            -DBUILD_STATIC_LIBS=on \
            -DBUILD_SHARED_LIBS=off \
            -DCURL_USE_MBEDTLS=on \
            -DMBEDTLS_USE_STATIC_LIBS=on \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_BUILD_TYPE=Release &&
            cmake --build build -j4 &&
            cmake --install build &&
            cd /workspace &&
            cmake -B build \
            -DCMAKE_VERBOSE_MAKEFILE=on \
            -DCMAKE_CXX_COMPILER=g++ \
            -DUSE_XTERM=on \
            -DPACKAGE=on \
            -DUSE_MBEDTLS=on \
            -DCMAKE_BUILD_TYPE=Release &&
            cmake --build build -j4 &&
            cpack -B build --config build/CPackConfig.cmake
        run: |
          docker exec build-container bash -c "$SCRIPT"
      - name: Get version number
        id: get-vn
        run: |
          awk '/^  VERSION [0-9.]+$/ {print "vn="$NF}' CMakeLists.txt >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Upload the packages
        uses: actions/upload-artifact@v6
        with:
          name: transferase-${{ steps.get-vn.outputs.vn }}-Linux
          path: build/transferase-${{ steps.get-vn.outputs.vn }}-Linux.*
